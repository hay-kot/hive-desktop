version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - govet
    - ineffassign
    - interfacebloat
    - misspell
    - modernize
    - nakedret
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testifylint
    - unconvert
    - unused
    - usetesting
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/util
              desc: |
                Deprecated: As of Go 1.16, the same functionality is now provided by
                package io or package os, and those implementations should be
                preferred in new code. See the specific function documentation for
                details.
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
        core:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/wailsapp/wails/v3
              desc: |
                internal/app is the headless core: no transport, no Wails.
                A Wails service struct belongs in internal/adapter/wailsui;
                a core package that needs something from the outside declares
                an interface and takes it as a constructor parameter.
                See docs/architecture.md, "Layers and the dependency rule".
            - pkg: github.com/hay-kot/hive-desktop/internal/adapter
              desc: |
                Dependencies point one way: adapter -> app -> hivecore.
                A core package that needs something from an adapter has the
                interface backwards — declare it in app and let the adapter
                satisfy it structurally.
        # internal/hivecore is vendored and read-only (docs/architecture.md,
        # "Bounded Context"): its types stop at the Anti-Corruption Layer and
        # never appear in an app signature. The files list below is the
        # allowlist, verified by grep on 2026-07-25 against the real tree:
        # dispatch/hive_adapters.go (the seam itself), store/dbext.go (calls
        # vendored migrate.Up during schema init), and app.go (constructs the
        # vendored hive runtime — coredb, eventbus, stores, hive session
        # service — and hands it to the seam). This is deliberately not a
        # blanket pass for internal/app/*_test.go: a test file is only
        # allowlisted where it itself exercises a seam interface with a
        # vendored type — hive_adapters_test.go (constructs the vendored hive
        # services it wraps) and launch_session_executor_test.go (its fake
        # SessionCreator returns *session.Session to satisfy
        # hive_adapters.go's SessionCreator interface) both do; dbext_test.go
        # exercises the vendored migration runner directly. Every other test
        # file under internal/app — including app_test.go, sources_test.go,
        # settings_service_test.go — is expected to stay clean of hivecore
        # imports, same as its production counterpart, and is not exempted.
        # internal/adapter is a separate bounded context from this rule's
        # concern: the wailsui e2e suite legitimately builds vendored store
        # fixtures there, and that is out of scope here, not an exception to
        # it.
        hivecore:
          files:
            - "**/internal/app/**"
            - "!**/internal/app/app.go"
            - "!**/internal/app/dispatch/hive_adapters.go"
            - "!**/internal/app/dispatch/hive_adapters_test.go"
            - "!**/internal/app/dispatch/launch_session_executor_test.go"
            - "!**/internal/app/store/dbext.go"
            - "!**/internal/app/store/dbext_test.go"
          deny:
            - pkg: github.com/hay-kot/hive-desktop/internal/hivecore
              desc: |
                internal/app consumes hivecore only through the seam:
                declare a narrow interface here, let the vendored type
                satisfy it structurally, convert at the boundary in
                dispatch/hive_adapters.go — see SlugifySessionName and
                ValidateSessionName there for the trivial-wrapper case
                (wrapping session.Slugify/session.ValidateName so
                launch_session_executor.go doesn't import hivecore for two
                helper calls). ADR 0015 ported the GitHub client out of
                hivecore entirely because it had leaked into exported
                signatures across three files; this rule exists so that
                boundary doesn't regrow one import at a time. If this file
                genuinely belongs at the seam, extend the allowlist in
                this rule's `files`, with a comment saying why — don't
                suppress the finding.
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^application\.Get$
          msg: >-
            Rule 2: application.Get() is only valid inside
            internal/adapter/wailsui. Take what you need as a constructor
            parameter instead.
        - pattern: ^context\.Background$
          msg: >-
            Rule 3: context.Context is the first parameter of every core
            method. context.Background() inside a service method makes CLI
            cancellation and HTTP deadlines impossible.
        - pattern: ^emit[A-Z]\w*$
          msg: >-
            Rule 5: the core publishes a typed payload to app/events. Wake-up
            degradation belongs to the wailsui adapter subscriber.
    gocritic:
      enabled-checks:
        - ruleguard
    interfacebloat:
      # Not the default 10 and not 6. Consumer-defined interfaces here are
      # narrow — ingest.Appender is four methods, flow.Refs is two — but
      # dispatch.OutputCommandStore has seven that are the complete lifecycle
      # of one entity, and the worker calls all seven. Splitting it to satisfy
      # a linter is the opposite of the rule's intent.
      max: 8
    revive:
      confidence: 3
      severity: warning
    tagalign:
      order:
        - json
        - schema
        - yaml
        - yml
        - toml
        - validate
    testifylint:
      enable-all: true
  exclusions:
    generated: lax
    rules:
      # forbidigo has no per-rule path filter, so the scope of the three rules
      # above is carved here. The adapter and package main are where
      # application.Get, context.Background and the emit helpers belong.
      - path: internal/adapter/wailsui/
        linters: [forbidigo]
      - path: ^desktop/
        linters: [forbidigo]
      # app.App holds the application's lifetime context. containedctx exists
      # to stop a *request* context being stashed on a service, and it still
      # does -- every *_service.go in this same package is in scope. App is
      # the one type whose lifetime that context represents: the config
      # watchers and the auth change hook are wired at construction and run
      # on their own goroutines, so there is no caller context to thread.
      - path: internal/app/app\.go
        linters: [containedctx]
      # cmd/ holds one-shot build tooling (the release publisher, the vendor
      # sync), not the app. A main() is a legitimate context root, and a git
      # subprocess in a build tool needs no cancellation plumbing.
      - path: ^cmd/
        linters: [forbidigo, noctx, contextcheck]
      # httptest.NewRequest and http.Post in tests. Rewriting seven test
      # helpers to thread a context they do not use buys nothing; noctx exists
      # here to catch an outbound request built without one in production.
      - path: _test\.go
        linters: [noctx]
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/hivecore
issues:
  fix: false
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/hivecore
  settings:
    gofumpt:
      extra-rules: false
