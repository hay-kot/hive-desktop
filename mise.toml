[tools]
"go" = "1.26"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-alpha2.117"
"go:github.com/abice/go-enum" = "v0.9.4"
"github:sqlc-dev/sqlc" = "v1.31.1"
golangci-lint = "2.12.2"

[env]
# hive is fetched directly: the sum.golang.org proxy lags freshly pushed
# commits, and the vendor pin usually is one.
GOPRIVATE = "github.com/colonyops/hive"
# Local secrets (release signing/notary/R2). Gitignored; absent in CI.
_.file = { path = ".env", redact = true }

[tasks."release:desktop"]
description = "Build, sign, notarize, and publish the desktop app to R2 (args: <version> [flags])"
run = "./scripts/release/release-desktop.sh"

[tasks.vendor]
description = "Sync internal/hivecore from the pinned hive commit (see scripts/vendorhive)"
run = "go run ./scripts/vendorhive"

[tasks."generate:enums"]
description = "Generate enum methods using go-enum"
sources = ["internal/desktop/activity/activity.go", "internal/desktop/jobs/jobs.go", "internal/desktop/pipeline/pipelinedb/classify.go", "internal/desktop/pipeline/flow/flow.go", "desktop/pipelineservice.go"]
outputs = ["internal/desktop/activity/activity_enum.go", "internal/desktop/jobs/jobs_enum.go", "internal/desktop/pipeline/pipelinedb/classify_enum.go", "internal/desktop/pipeline/flow/flow_enum.go", "desktop/pipelineservice_enum.go"]
run = "go-enum --nocase --names --marshal -f internal/desktop/activity/activity.go -f internal/desktop/jobs/jobs.go -f internal/desktop/pipeline/pipelinedb/classify.go -f internal/desktop/pipeline/flow/flow.go -f desktop/pipelineservice.go"

[tasks.generate]
description = "Run all code generators (vendored hivecore is generated upstream)"
depends = ["generate:enums"]
sources = [
  "internal/desktop/pipeline/pipelinedb/queries/queries.sql",
  "internal/desktop/pipeline/pipelinedb/migrations/*.up.sql",
  "sqlc.yaml",
]
outputs = [
  "internal/desktop/pipeline/pipelinedb/db.go",
  "internal/desktop/pipeline/pipelinedb/models.go",
  "internal/desktop/pipeline/pipelinedb/queries.sql.go",
]
run = "sqlc generate"

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt ./..."

[tasks.check]
description = "Run tidy, lint, and test"
run = ["go mod tidy", { tasks = ["lint", "test"] }]

[tasks."desktop:dev"]
description = "Run the desktop app in dev mode (wails3 dev). Picks a free Vite port so instances run concurrently; injects the git branch for the dev bar."
dir = "desktop"
run = """
port="$(./build/scripts/dev-port.sh)"
branch="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
echo "hive desktop dev: vite port ${port}, branch ${branch}"
WAILS_VITE_PORT="${port}" VITE_HIVE_DEV_BRANCH="${branch}" wails3 dev -config ./build/config.yml
"""

[tasks."desktop:build"]
description = "Build the desktop app"
dir = "desktop"
run = "wails3 build"

[tasks."desktop:icons"]
description = "Regenerate desktop icon assets from SVG masters"
dir = "desktop"
run = "./build/icons/generate.sh"

[tasks."desktop:generate"]
description = "Regenerate desktop TS bindings"
dir = "desktop"
run = "wails3 generate bindings -clean=true -ts -i"

[tasks."desktop:serve"]
description = "Build and run the desktop app as a headless HTTP server (server build)"
# The server binary embeds frontend/dist, so the frontend must be built first —
# a fresh clone's dist contains only .gitkeep. Port override: WAILS_SERVER_PORT.
run = [
  "cd desktop/frontend && npm run build",
  "go build -tags server -o ./desktop/bin/hive-desktop-server ./desktop",
  "./desktop/bin/hive-desktop-server",
]

[tasks."desktop:test"]
description = "Run desktop frontend + Go tests"
run = ["cd desktop/frontend && npm test", "go test ./desktop/... ./internal/desktop/..."]

[tasks."desktop:e2e"]
description = "Run desktop e2e tests in the pinned Docker/Playwright environment"
run = "./desktop/e2e/scripts/run-docker.sh"
