[tools]
"go" = "1.26"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-alpha2.119"
"go:github.com/abice/go-enum" = "v0.9.4"
"go:golang.org/x/tools/cmd/deadcode" = "v0.48.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"
"github:sqlc-dev/sqlc" = "v1.31.1"
golangci-lint = "2.12.2"
lefthook = "2.1.10"

[env]
# hive is fetched directly: the sum.golang.org proxy lags freshly pushed
# commits, and the vendor pin usually is one.
GOPRIVATE = "github.com/colonyops/hive"
# Local secrets (release signing/notary/R2). The generated launch.env is
# intentionally scoped to desktop:dev so tests, release tools, and the
# headless server do not inherit development paths or framework ports.
_.file = { path = ".env", redact = true }

# A tool install wires hooks and prepares this worktree's isolated desktop
# instance. The enter hook only fills a missing launch.env. Each later mise
# command reloads the generated file before running, including desktop:dev.
[hooks]
postinstall = { task = "setup" }
enter = "test -f '{{config_root}}/launch.env' || (cd '{{config_root}}' && go run ./cmd/devtools prepare)"

[tasks.setup]
description = "Install git hooks and prepare this worktree's isolated desktop launch environment"
depends = ["desktop:dev:prepare"]
run = "./scripts/hooks/install.sh"

[tasks."release:desktop"]
description = "Deploy the web landing page/worker, then build, sign, notarize, and publish the desktop app to R2 (args: <version> [flags])"
run = "go run ./cmd/release publish"

[tasks.vendor]
description = "Sync internal/hivecore from the pinned hive commit (see cmd/vendorhive)"
run = "go run ./cmd/vendorhive"

[tasks.devserver]
description = "Run the dev GitHub proxy + event simulator (see cmd/devserver). Point instances at it with HIVE_DESKTOP_DEVELOPMENT_GITHUB_API_BASE."
run = "go run ./cmd/devserver --config cmd/devserver/devserver.yaml"

[tasks."generate:enums"]
description = "Generate enum methods using go-enum"
# The file list appears twice on purpose. `sources` must be a literal array:
# templating it from a [vars] entry renders to a path that matches nothing, and
# mise then silently reruns the task every time instead of erroring.
sources = ["internal/app/activity/activity.go", "internal/app/jobs/jobs.go", "internal/app/store/classify.go", "internal/app/flow/flow.go"]
outputs = { auto = true }
run = "go-enum --nocase --names --marshal -f internal/app/activity/activity.go -f internal/app/jobs/jobs.go -f internal/app/store/classify.go -f internal/app/flow/flow.go"

[tasks."generate:sqlc"]
description = "Generate the store layer from SQL queries and migrations"
sources = [
  "internal/app/store/queries/queries.sql",
  "internal/app/store/migrations/*.up.sql",
  "sqlc.yaml",
]
outputs = { auto = true }
run = "sqlc generate"

# Aggregate only. The two generators write disjoint files, so mise running
# `depends` in parallel is safe here.
[tasks.generate]
description = "Run all code generators (vendored hivecore is generated upstream)"
depends = ["generate:enums", "generate:sqlc"]

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt ./..."

[tasks."fmt:files"]
description = "Run golangci-lint fmt on the given Go files (pre-commit hook target)"
run = "golangci-lint fmt"

[tasks.tidy]
description = "Rewrite go.mod/go.sum to be tidy"
run = "go mod tidy"

# The whole Go gate, in one definition, so lefthook's pre-push and the release
# workflow can both call `mise run check` instead of restating the sequence.
# Frontend tests are deliberately not here: pre-push only wants them when the
# push touches desktop/frontend/, and that condition belongs in lefthook.
#
# Ordered, not `depends`: mise runs `depends` in parallel, and check:generate
# rewrites the .go files that lint and test read. A run list is sequential, so
# generation finishes before anything reads its output. The second group is
# safe to run concurrently — all three only read.
[tasks.check]
description = "Full Go gate: generated code, tidy, lint, test"
run = [
  { tasks = ["check:generate"] },
  { tasks = ["check:tidy", "lint", "test"] },
]

[tasks."check:tidy"]
description = "Verify go.mod/go.sum are tidy without rewriting them"
run = """
go mod tidy -diff || {
  echo "go.mod/go.sum are not tidy. Run 'mise run tidy' and commit the result." >&2
  exit 1
}
"""

[tasks."check:generate"]
description = "Verify generated code (enums, sqlc) matches its sources"
run = """
mise run --force generate
# -N registers files the generators created that the checkout lacks, for the
# same reason check:bindings and check:vendor do it: plain git diff cannot see
# an untracked file, so a brand-new enum or query output would pass unnoticed.
# The diff is against HEAD because that same git add stages any deletion the
# generators made, which a worktree-only diff would then report as clean.
git add -N internal/app
git diff HEAD --exit-code -- 'internal/app/*_enum.go' internal/app/store/db.go internal/app/store/models.go internal/app/store/queries.sql.go || {
  echo "Generated files are out of date. Run 'mise run generate' and commit the result." >&2
  exit 1
}
"""

[tasks."check:bindings"]
description = "Verify the committed Wails TS bindings match the Go service surface"
run = """
mise run desktop:generate
# -N registers files the generator created that the checkout lacks, for the
# same reason check:vendor does: -clean=true deletes and recreates the tree,
# and plain git diff cannot see an untracked file. The diff is against HEAD
# because that same git add stages the deletions -clean=true made, which a
# worktree-only diff would then report as clean.
git add -N desktop/frontend/bindings
git diff HEAD --exit-code -- desktop/frontend/bindings || {
  echo "Wails bindings are out of date. Run 'mise run desktop:generate' and commit the result." >&2
  exit 1
}
"""

# Not part of `check`: this builds the whole program's SSA and takes ~40s,
# well past the pre-push budget. CI-only, same as check:bindings.
[tasks."check:deadcode"]
description = "Report functions unreachable from any main or test entry point"
run = """
# -test counts test files as entry points, so a helper only a test calls is
# reachable, not dead. internal/hivecore is subtracted rather than allowlisted
# via -filter: vendored code legitimately carries surface this repo does not
# call, and subtracting keeps new first-party packages in the gate by default
# instead of silently escaping an out-of-date filter regex.
#
# Not piped straight into grep: deadcode's own failures go to stderr, so a
# broken analysis would leave an empty report and pass the gate silently.
if ! found=$(deadcode -test ./...); then
  echo "deadcode failed to analyze the program (see the error above)." >&2
  exit 1
fi
report=$(printf '%s\n' "$found" | grep -v '^internal/hivecore/' || true)
# deadcode exits 0 even when it reports findings, so the output is the gate.
if [ -n "$report" ]; then
  echo "$report" >&2
  echo "Unreachable functions found. Delete them, or wire up the caller that should have been calling them." >&2
  exit 1
fi
"""

# Not part of `check`: needs the network for the vulnerability database.
# Exits 3 only when a vulnerable symbol is actually reachable from this code;
# advisories against imported-but-uncalled packages do not fail the build.
[tasks."check:vuln"]
description = "Scan dependencies for known vulnerabilities reachable from this code (network: fetches the vuln database)"
run = "govulncheck ./..."

[tasks."check:vendor"]
description = "Verify internal/hivecore matches the pinned hive commit (network: fetches hive)"
run = """
go run ./cmd/vendorhive --skip-gomod
# -N registers files vendorhive created that the checkout lacks (e.g. a new
# embed asset) so git diff reports them as drift too — plain git diff cannot
# see untracked files. The diff is against HEAD because that same git add
# stages the deletions vendorhive made (it recreates the tree from scratch),
# which a worktree-only diff would then report as clean.
git add -N internal/hivecore
git diff HEAD --exit-code -- internal/hivecore || {
  echo "internal/hivecore has drifted. Never edit vendored code; run 'mise run vendor' after landing changes in hive." >&2
  exit 1
}
"""

[tasks."desktop:dev"]
description = "Run Wails directly using launch.env and this worktree's isolated .hive-desktop instance"
dir = "desktop"
# launch.env is generated; optional overrides.env is developer-authored and
# wins because mise loads it second.
env = { _.file = ["launch.env", "overrides.env"], VITE_HIVE_DEV_BRANCH = "{{ exec(command='git branch --show-current') }}" }
# The runner goes through `devtools run` rather than being exec'd directly: it
# leaves the app running when the terminal closes, and it only ever SIGKILLs
# the app. See cmd/devtools/devsession.go and ADR 0046.
run = """
test -f ../launch.env || {
  echo "launch.env is missing; run 'mise run desktop:dev:prepare' first" >&2
  exit 1
}
go run ../cmd/devtools run -- wails3 dev -config ./build/config.yml
"""

[tasks."desktop:dev:prepare"]
description = "Create or reuse this worktree's desktop instance and generate launch.env"
run = "go run ./cmd/devtools prepare"

[tasks."desktop:dev:fresh"]
description = "Safely recreate this worktree's desktop instance and regenerate launch.env"
run = "go run ./cmd/devtools fresh"

[tasks."desktop:dev:reset"]
description = "Safely delete this worktree's marked desktop instance and launch.env"
run = "go run ./cmd/devtools reset"

[tasks."desktop:build"]
description = "Build the desktop app"
dir = "desktop"
run = "wails3 build"

[tasks."desktop:build:linux:image"]
description = "Pre-build the container image that compiles Linux binaries (ARCH=amd64|arm64)"
run = './scripts/build/build-linux-docker.sh --image-only ${ARCH:+--arch=$ARCH}'

[tasks."desktop:build:linux"]
description = "Build the Linux desktop binary in a container (ARCH=amd64|arm64, default: this machine's)"
# Runs the same `wails3 task linux:build` the release pipeline runs, just inside
# a container, so a Linux binary built here matches the published one. Output
# lands in desktop/bin/hive-desktop, overwriting any native build there. Builds
# the image on first use and rebuilds it when the Dockerfile or wails3 pin
# changes.
run = './scripts/build/build-linux-docker.sh ${ARCH:+--arch=$ARCH}'

[tasks."desktop:icons"]
description = "Regenerate desktop icon assets from SVG masters"
dir = "desktop"
run = "./build/icons/generate.sh"

[tasks."desktop:generate"]
description = "Regenerate desktop TS bindings"
dir = "desktop"
run = "wails3 generate bindings -clean=true -ts -i"

[tasks."desktop:serve"]
description = "Build and run the desktop app as a headless HTTP server (server build)"
# The server binary embeds frontend/dist, so the frontend must be built first —
# a fresh clone's dist contains only .gitkeep. Port override: WAILS_SERVER_PORT.
run = [
  "cd desktop/frontend && npm run build",
  "go build -tags server -o ./desktop/bin/hive-desktop-server ./desktop",
  "./desktop/bin/hive-desktop-server",
]

[tasks."desktop:test:frontend"]
description = "Run desktop frontend unit tests (vitest)"
dir = "desktop/frontend"
run = "npm test"

[tasks."desktop:test"]
description = "Run desktop frontend + Go tests"
depends = ["desktop:test:frontend"]
run = "go test ./desktop/... ./internal/app/... ./internal/adapter/..."

[tasks."desktop:e2e"]
description = "Run desktop e2e tests in the pinned Docker/Playwright environment"
run = "./desktop/e2e/scripts/run-docker.sh"
