[tools]
"go" = "1.26"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-alpha2.117"
"go:github.com/abice/go-enum" = "v0.9.4"
"github:sqlc-dev/sqlc" = "v1.31.1"
golangci-lint = "2.12.2"
lefthook = "2.1.10"

[env]
# hive is fetched directly: the sum.golang.org proxy lags freshly pushed
# commits, and the vendor pin usually is one.
GOPRIVATE = "github.com/colonyops/hive"
# Local secrets (release signing/notary/R2). The generated launch.env is
# intentionally scoped to desktop:dev so tests, release tools, and the
# headless server do not inherit development paths or framework ports.
_.file = { path = ".env", redact = true }

# A tool install wires hooks and prepares this worktree's isolated desktop
# instance. The enter hook only fills a missing launch.env. Each later mise
# command reloads the generated file before running, including desktop:dev.
[hooks]
postinstall = { task = "setup" }
enter = "test -f '{{config_root}}/launch.env' || (cd '{{config_root}}' && go run ./cmd/devtools prepare)"

[tasks.setup]
description = "Install git hooks and prepare this worktree's isolated desktop launch environment"
run = [
  "./scripts/hooks/install.sh",
  "go run ./cmd/devtools prepare",
]

[tasks."release:desktop"]
description = "Build, sign, notarize, and publish the desktop app to R2 (args: <version> [flags])"
run = "go run ./cmd/release publish"

[tasks.vendor]
description = "Sync internal/hivecore from the pinned hive commit (see cmd/vendorhive)"
run = "go run ./cmd/vendorhive"

[tasks."generate:enums"]
description = "Generate enum methods using go-enum"
sources = ["internal/app/activity/activity.go", "internal/app/jobs/jobs.go", "internal/app/store/classify.go", "internal/app/flow/flow.go"]
outputs = ["internal/app/activity/activity_enum.go", "internal/app/jobs/jobs_enum.go", "internal/app/store/classify_enum.go", "internal/app/flow/flow_enum.go"]
run = "go-enum --nocase --names --marshal -f internal/app/activity/activity.go -f internal/app/jobs/jobs.go -f internal/app/store/classify.go -f internal/app/flow/flow.go"

[tasks.generate]
description = "Run all code generators (vendored hivecore is generated upstream)"
depends = ["generate:enums"]
sources = [
  "internal/app/store/queries/queries.sql",
  "internal/app/store/migrations/*.up.sql",
  "sqlc.yaml",
]
outputs = [
  "internal/app/store/db.go",
  "internal/app/store/models.go",
  "internal/app/store/queries.sql.go",
]
run = "sqlc generate"

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt ./..."

[tasks."fmt:files"]
description = "Run golangci-lint fmt on the given Go files (pre-commit hook target)"
run = "golangci-lint fmt"

[tasks.check]
description = "Run tidy, lint, and test"
run = ["go mod tidy", { tasks = ["lint", "test"] }]

[tasks."check:tidy"]
description = "Verify go.mod/go.sum are tidy without rewriting them"
run = "go mod tidy -diff"

[tasks."check:generate"]
description = "Verify generated code (enums, sqlc) matches its sources"
run = """
mise run --force generate
git diff --exit-code -- '*_enum.go' internal/app/store/db.go internal/app/store/models.go internal/app/store/queries.sql.go || {
  echo "Generated files are out of date. Run 'mise run generate' and commit the result." >&2
  exit 1
}
"""

[tasks."check:bindings"]
description = "Verify the committed Wails TS bindings match the Go service surface"
run = """
mise run desktop:generate
# -N registers files the generator created that the checkout lacks, for the
# same reason check:vendor does: -clean=true deletes and recreates the tree,
# and plain git diff cannot see an untracked file.
git add -N desktop/frontend/bindings
git diff --exit-code -- desktop/frontend/bindings || {
  echo "Wails bindings are out of date. Run 'mise run desktop:generate' and commit the result." >&2
  exit 1
}
"""

[tasks."check:vendor"]
description = "Verify internal/hivecore matches the pinned hive commit (network: fetches hive)"
run = """
go run ./cmd/vendorhive --skip-gomod
# -N registers files vendorhive created that the checkout lacks (e.g. a new
# embed asset) so git diff reports them as drift too — plain git diff cannot
# see untracked files.
git add -N internal/hivecore
git diff --exit-code -- internal/hivecore || {
  echo "internal/hivecore has drifted. Never edit vendored code; run 'mise run vendor' after landing changes in hive." >&2
  exit 1
}
"""

[tasks."desktop:dev"]
description = "Run Wails directly using launch.env and this worktree's isolated .hive-desktop instance"
dir = "desktop"
# launch.env is generated; optional overrides.env is developer-authored and
# wins because mise loads it second.
env = { _.file = ["launch.env", "overrides.env"], VITE_HIVE_DEV_BRANCH = "{{ exec(command='git branch --show-current') }}" }
run = """
test -f ../launch.env || {
  echo "launch.env is missing; run 'mise run desktop:dev:prepare' first" >&2
  exit 1
}
wails3 dev -config ./build/config.yml
"""

[tasks."desktop:dev:prepare"]
description = "Create or reuse this worktree's desktop instance and generate launch.env"
run = "go run ./cmd/devtools prepare"

[tasks."desktop:dev:fresh"]
description = "Safely recreate this worktree's desktop instance and regenerate launch.env"
run = "go run ./cmd/devtools fresh"

[tasks."desktop:dev:reset"]
description = "Safely delete this worktree's marked desktop instance and launch.env"
run = "go run ./cmd/devtools reset"

[tasks."desktop:build"]
description = "Build the desktop app"
dir = "desktop"
run = "wails3 build"

[tasks."desktop:icons"]
description = "Regenerate desktop icon assets from SVG masters"
dir = "desktop"
run = "./build/icons/generate.sh"

[tasks."desktop:generate"]
description = "Regenerate desktop TS bindings"
dir = "desktop"
run = "wails3 generate bindings -clean=true -ts -i"

[tasks."desktop:serve"]
description = "Build and run the desktop app as a headless HTTP server (server build)"
# The server binary embeds frontend/dist, so the frontend must be built first —
# a fresh clone's dist contains only .gitkeep. Port override: WAILS_SERVER_PORT.
run = [
  "cd desktop/frontend && npm run build",
  "go build -tags server -o ./desktop/bin/hive-desktop-server ./desktop",
  "./desktop/bin/hive-desktop-server",
]

[tasks."desktop:test:frontend"]
description = "Run desktop frontend unit tests (vitest)"
dir = "desktop/frontend"
run = "npm test"

[tasks."desktop:test"]
description = "Run desktop frontend + Go tests"
depends = ["desktop:test:frontend"]
run = "go test ./desktop/... ./internal/app/... ./internal/adapter/..."

[tasks."desktop:e2e"]
description = "Run desktop e2e tests in the pinned Docker/Playwright environment"
run = "./desktop/e2e/scripts/run-docker.sh"
