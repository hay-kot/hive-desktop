name: Deploy Web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # web/mise.toml pins Python, uv, and Node, so the site builds with the same
      # toolchain a contributor's `mise run build` in web/ uses.
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          working_directory: web
          install_args: python uv node

      - name: Install dependencies
        run: mise run install

      - name: Build site
        run: mise run build

      # Deploys the Zensical output in web/site plus the Worker that serves it.
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
