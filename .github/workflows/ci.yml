name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/colonyops/hive

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pinned wails alpha defaults to the GTK4/WebKitGTK 6.0 stack on
      # Linux (GTK3 is opt-in via -tags gtk3, which nothing here passes).
      # tmux is a test dependency, not a build one: the terminal integration
      # tests attach a real control-mode client and skip themselves without it,
      # which would silently drop the only proof the transport works (ADR 0036).
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev tmux

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4

      # Both checks are also local git hooks (see lefthook.yml); the mise task
      # is the single definition so the two can never drift.
      - name: Check generated files are up-to-date
        run: mise run check:generate

      # Binding method IDs hash the Go package path, so a service that moved
      # without a regenerate leaves committed TypeScript that typechecks and
      # fails every RPC at runtime. Nothing else in this workflow can see it.
      - name: Check Wails bindings are up-to-date
        run: mise run check:bindings

      - name: Check vendored hivecore matches the pinned hive commit
        run: mise run check:vendor

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=6m

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

      # Both run after the build: each needs the whole program to load, and a
      # compile error here would be a confusing way to learn the code is broken.
      # Neither is in `mise run check` — deadcode builds the program's SSA
      # (~40s) and govulncheck needs the network, so both are past what a
      # pre-push hook should cost.
      - name: Check for unreachable code
        run: mise run check:deadcode

      # Advisories against packages this repo imports but never calls do not
      # fail the build; govulncheck exits non-zero only for a reachable symbol.
      - name: Check dependencies for known vulnerabilities
        run: mise run check:vuln

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Test frontend
        working-directory: desktop/frontend
        run: npm test
