name: CI

# The push trigger exists to seed caches, not for post-merge signal: a PR run
# can only restore caches from its own ref scope or from the default branch's,
# so without a run on main every PR starts cold. See ADR ci-runs-on-main-to-seed-the-cache-prs-read.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled main run writes no cache, and that cache is what keeps PR runs
  # warm. Superseded PR runs are still waste worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fetch hive directly rather than through the module proxy: sum.golang.org
  # lags freshly pushed commits, and the vendor pin usually is one. This is a
  # proxy and checksum-database bypass, not a visibility setting. colonyops/hive
  # is public, so this is not redundant. Removing it fails CI intermittently,
  # only on the PRs that bump the vendor pin. Same reason as mise.toml.
  GOPRIVATE: github.com/colonyops/hive

jobs:
  # Split from go-quality so the race-detector test run and the analysis tools
  # overlap rather than queue; both pay the toolchain setup, which is the cost
  # the split trades against. See ADR ci-runs-on-main-to-seed-the-cache-prs-read.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pinned wails alpha defaults to the GTK4/WebKitGTK 6.0 stack on
      # Linux (GTK3 is opt-in via -tags gtk3, which nothing here passes).
      # tmux is a test dependency, not a build one: the terminal integration
      # tests attach a real control-mode client and skip themselves without it,
      # which would silently drop the only proof the transport works (ADR terminal-transport).
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev tmux

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      # Both checks are also local git hooks (see lefthook.yml); the mise task
      # is the single definition so the two can never drift.
      - name: Check generated files are up-to-date
        run: mise run check:generate

      # Binding method IDs hash the Go package path, so a service that moved
      # without a regenerate leaves committed TypeScript that typechecks and
      # fails every RPC at runtime. Nothing else in this workflow can see it.
      - name: Check Wails bindings are up-to-date
        run: mise run check:bindings

      - name: Check vendored hivecore matches the pinned hive commit
        run: mise run check:vendor

      # Two branches can add an ADR without git conflicting, so nothing but this
      # would notice a duplicate slug, a citation left pointing at a renamed
      # decision, or an index that was merged but not regenerated.
      - name: Check ADR ids, citations, and index
        run: mise run check:adr

      - name: Build
        run: go build ./...

      # -race roughly doubles the suite, and it is the single largest cost in
      # this job. Merges to main still run it (that job is not on anyone's
      # critical path), so a data race is caught before a release rather than
      # before a review.
      - name: Test
        run: mise run ${{ github.event_name == 'push' && 'test:race' || 'test' }}

  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every tool here loads the wailsui package, so the cgo headers are as
      # much a dependency of the analysis as they are of the build.
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      # First in the job: it is the fastest of the three and the only one that
      # reports a compile error legibly, so a broken tree fails here rather than
      # inside an SSA build.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=6m

      # Neither is in `mise run check` — deadcode builds the program's SSA
      # (~40s) and govulncheck needs the network, so both are past what a
      # pre-push hook should cost.
      - name: Check for unreachable code
        run: mise run check:deadcode

      # Advisories against packages this repo imports but never calls do not
      # fail the build; govulncheck exits non-zero only for a reachable symbol.
      - name: Check dependencies for known vulnerabilities
        run: mise run check:vuln

  # The vue-tsc typecheck and the vitest suite are independent; one job made the
  # shorter wait on the longer.
  desktop-frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  desktop-frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test
