name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/colonyops/hive

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      # The wails3 CLI is only needed by local desktop:dev/build/generate
      # tasks; installing it in CI compiles wails' gtk-dependent packages
      # for no benefit.
      MISE_DISABLE_TOOLS: "go:github.com/wailsapp/wails/v3/cmd/wails3"
    steps:
      - uses: actions/checkout@v7

      # The pinned wails alpha defaults to the GTK4/WebKitGTK 6.0 stack on
      # Linux (GTK3 is opt-in via -tags gtk3, which nothing here passes).
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@v4

      # Both checks are also local git hooks (see lefthook.yml); the mise task
      # is the single definition so the two can never drift.
      - name: Check generated files are up-to-date
        run: mise run check:generate

      - name: Check vendored hivecore matches the pinned hive commit
        run: mise run check:vendor

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=6m

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Test frontend
        working-directory: desktop/frontend
        run: npm test
