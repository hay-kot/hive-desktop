name: Publish Desktop

# Publishes the desktop app by wrapping scripts/release/release-desktop.sh —
# the same pipeline used for local releases (docs/distribution.md). Pushing a
# desktop-v<semver> tag builds the universal macOS .app, signs it with a
# Developer ID certificate, notarizes + staples it, uploads the zip and
# SHA256SUMS to the immutable R2 release prefix, and rewrites the channel
# manifests the in-app updater polls.
#
# The version's prerelease identifier routes the channel and its cascade
# (docs/decisions/0004): desktop-v1.4.0 → stable+beta+dev, -beta.N → beta+dev,
# -dev.N → dev only. The script rejects any other identifier, so a typoed tag
# cannot mint a channel. Desktop releases stay fully decoupled from the CLI's
# v* tags in colonyops/hive.
#
# Required repository secrets:
#   MACOS_CERTIFICATE       base64-encoded Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD   password for that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Acme (TEAMID)"
#   AC_API_KEY              base64-encoded App Store Connect API .p8 key
#   AC_API_KEY_ID           App Store Connect API key id
#   AC_API_ISSUER_ID        App Store Connect API issuer id
#   R2_ACCESS_KEY_ID        R2 S3 credential (Object Read & Write on the bucket)
#   R2_SECRET_ACCESS_KEY    R2 S3 credential secret

permissions:
  contents: read

on:
  push:
    tags: ["desktop-v*"]

env:
  GOPRIVATE: github.com/colonyops/hive

jobs:
  publish:
    name: "Publish Desktop (macOS)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Set up mise (provides the pinned wails3)
        uses: jdx/mise-action@v4

      - name: Build, sign, notarize, and publish
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: ./scripts/release/release-desktop.sh "${GITHUB_REF_NAME#desktop-v}"
