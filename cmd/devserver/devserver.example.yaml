# devserver configuration — copy to $XDG_CONFIG_HOME/hive/desktop/devserver.yaml
#
# Every section is optional. With no file at all devserver is a caching proxy,
# which is the whole fix for the rate-limit problem; the rest is simulation.
#
#   mise run devserver
#   HIVE_DESKTOP_DEVELOPMENT_GITHUB_API_BASE=http://127.0.0.1:7777 mise run desktop:dev

listen: 127.0.0.1:7777
upstream: https://api.github.com

cache:
  # How long a response is served before revalidating. Revalidation sends
  # If-None-Match, and a 304 costs no primary rate-limit quota, so a short TTL
  # is cheap. The desktop's own poll floor is 60s.
  ttl: 5m
  # path: ~/.local/share/hive/devserver/cache.db   # derived when omitted

# Mutations applied on top of cached live responses. These seed the runtime
# state at startup; the dashboard and control API mutate from there, and a
# restart returns to exactly what this file declares.
overlays:
  - match: {repo: hay-kot/hive-desktop, num: 58}
    set:
      state: open                  # open | closed | merged
      reason: approval_requested   # becomes the feed's activity summary
      labels: [needs-review]
      # absent: true               # drop from search results; single-item
      #                            # endpoints still answer, which is how a
      #                            # merged PR really behaves and the only way
      #                            # to exercise ConfirmAbsence
      # title: Overridden title
      # draft: false
      # updated_at: 2026-07-25T12:00:00Z   # auto-stamped to now when omitted

# Named sequences, run from one dashboard click. Steps accumulate onto the
# item rather than replacing each other.
scenarios:
  pr-approval-flow:
    description: Review requested, then approval requested, then merged
    steps:
      - match: {repo: hay-kot/hive-desktop, num: 58}
        set: {reason: review_requested}
      # Waits should exceed the app's poll interval (60s floor) if you want
      # each step to land as its own separate event in the feed.
      - wait: 60s
      - match: {repo: hay-kot/hive-desktop, num: 58}
        set: {reason: approval_requested}
      - wait: 60s
      - match: {repo: hay-kot/hive-desktop, num: 58}
        set: {state: merged, absent: true}

  ci-fails-then-passes:
    description: Two CI notifications with a label flip between them
    steps:
      - match: {repo: hay-kot/hive-desktop, num: 58}
        set: {reason: ci_activity, labels: [ci-failed]}
      - wait: 60s
      - match: {repo: hay-kot/hive-desktop, num: 58}
        set: {reason: ci_activity, labels: []}

# Outbound webhook pusher. Targets point at a running desktop instance's local
# webhook listener: take the base URL from Settings ▸ Webhooks (the port is
# random per install) and append a webhook-source node's path. The secret must
# match that node's configured secret.
webhooks:
  targets:
    - name: local-desktop
      url: http://127.0.0.1:24681/hooks/devserver
      secret: dev-secret

  # Arbitrary JSON objects. A stable top-level "id" makes re-delivery update
  # the same inbox item; without one the listener hashes the body, so every
  # push is a new item. Following the canonical item contract (ADR 0008) makes
  # the payload render as a first-party feed row.
  payloads:
    pr-opened:
      id: pr-1
      kind: PR
      repo: acme/widgets
      num: 1
      title: Add retry to fetch
      url: https://github.com/acme/widgets/pull/1
      state: open
      author: someone

    # Push this to drive pr-1 to a terminal state — the webhook classifier
    # treats resolved/closed/done as terminal.
    pr-merged:
      id: pr-1
      kind: PR
      repo: acme/widgets
      num: 1
      title: Add retry to fetch
      url: https://github.com/acme/widgets/pull/1
      state: resolved
