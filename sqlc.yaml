version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/app/data/queries/queries"
    schema: "internal/app/data/queries/migrations/*.up.sql"
    gen:
      go:
        package: "queries"
        out: "internal/app/data/queries"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
