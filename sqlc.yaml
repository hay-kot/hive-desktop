version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/app/store/queries/queries.sql"
    schema: "internal/app/store/migrations/*.up.sql"
    gen:
      go:
        package: "store"
        out: "internal/app/store"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
